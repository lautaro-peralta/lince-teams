# Verificación en cada PR y en cada push a master. Lo que rompe acá NO llega a
# producción: el workflow de deploy (deploy.yml) espera a que este termine bien.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Servidor (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Todo el paquete compila (incluidos los módulos de escritorio, que el
      # servidor no importa pero se despliegan igual).
      - run: python -m compileall -q server lince
      # Smoke: auth, revocación de tokens, WebSocket y rutas contra SQLite.
      - run: python tests/smoke.py
